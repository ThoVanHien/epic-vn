# Cấu hình CMS: sửa nội dung trong các biểu mẫu, không đổi khóa name.
media:
  - name: images
    label: Hình ảnh
    input: images
    output: images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - avif
    rename: safe
  - name: documents
    label: Tài liệu PDF
    input: assets/documents
    output: assets/documents
    extensions:
      - pdf
    rename: safe
content:
  - name: site
    label: Thông tin chung & liên hệ
    type: file
    path: data/site.json
    format: json
    fields:
      - name: company
        label: Tên thương hiệu
        type: string
        required: true
      - name: legal_name
        label: Tên pháp lý doanh nghiệp
        type: string
      - name: tagline
        label: Dòng mô tả dưới logo
        type: string
      - name: logo
        label: Logo
        type: image
        options:
          media: images
      - name: phone
        label: Số điện thoại (chỉ số, có thể bắt đầu bằng +)
        type: string
        required: true
      - name: phone_label
        label: Số điện thoại hiển thị
        type: string
        required: true
      - name: email
        label: Email nhận yêu cầu tư vấn
        type: string
        required: true
      - name: address
        label: Địa chỉ
        type: text
      - name: tax_id
        label: Mã số thuế
        type: string
      - name: bank_name
        label: Ngân hàng
        type: string
      - name: bank_account
        label: Số tài khoản
        type: string
      - name: hours
        label: Giờ làm việc
        type: string
      - name: zalo
        label: Đường dẫn Zalo
        type: string
      - name: messenger
        label: Đường dẫn Messenger
        type: string
      - name: facebook
        label: Đường dẫn Facebook
        type: string
      - name: footer_description
        label: Giới thiệu ở chân trang
        type: text
      - name: copyright
        label: Dòng bản quyền
        type: string
      - name: profile_pdf
        label: File hồ sơ năng lực PDF (bỏ trống để nhận qua Zalo)
        type: file
        options:
          media: documents
  - name: catalog
    label: Sản phẩm
    type: file
    path: data/products.json
    format: json
    fields:
      - name: products
        label: Danh sách sản phẩm
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Tên sản phẩm
            type: string
            required: true
          - name: model
            label: Mã sản phẩm / Model
            type: string
          - name: category
            label: Danh mục
            type: reference
            required: true
            options:
              collection: categories
              search: title
              value: "{fields.id}"
              label: "{fields.title}"
          - name: brand
            label: Thương hiệu
            type: string
          - name: status
            label: Tình trạng hàng
            type: string
            default: Sẵn hàng
          - name: price
            label: Giá hiển thị (ví dụ 1.500.000 VNĐ hoặc Liên hệ)
            type: string
            default: Liên hệ báo giá
          - name: image
            label: Ảnh sản phẩm
            type: image
            options:
              media: images
          - name: specs
            label: Thông số kỹ thuật (mỗi mục một thông số)
            type: string
            list: true
          - name: description
            label: Mô tả chi tiết
            type: text
          - name: visible
            label: Hiển thị trên website
            type: boolean
            default: true
          - name: featured
            label: Nổi bật trên trang chủ
            type: boolean
            default: false
  - name: categories
    label: Danh mục sản phẩm
    type: collection
    path: data/categories
    format: json
    filename: "{fields.id}.json"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: id
        label: Mã danh mục (giữ nguyên khi đổi tên)
        type: string
        required: true
        description: Chỉ dùng chữ thường, số và dấu gạch ngang. Chuyển sản phẩm sang danh mục khác trước khi xóa.
      - name: title
        label: Tên danh mục
        type: string
        required: true
      - name: order
        label: Thứ tự hiển thị
        type: number
        default: 1
